name: Auth-API-$(Build.BuildId)

pr: none

trigger:
  batch: true
  branches:
    include:
      - main
  paths:
    include:
      - Auth.Api
      - Auth.Shared
    exclude:
      - README.md


resources:
  repositories:
    - repository: bt
      type: github
      name: FlyingCockatoo/BuildTemplates
      endpoint: FlyingCockatoo
      ref: refs/tags/v0.5.0
    - repository: nuget-helper
      type: github
      name: FlyingCockatoo/infra-build-nuget-helper
      endpoint: FlyingCockatoo
      ref: refs/heads/main

extends:
  template: dotnetservice.yml@bt
  parameters:
    projects:
      - Auth.Api
