name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  release:
    types:
      - released

jobs:
  test:
    name: Test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Add NuGet source
        run: |
          dotnet nuget add source --username FlyingCockatoo --password ${{ secrets.NUGET_PASSWORD }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/FlyingCockatoo/index.json"

      - name: Test
        run: dotnet test Auth.sln --configuration Release

      - name: Format
        run: dotnet format Auth.sln --verify-no-changes

  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set environment
        id: env
        run: |
          if [[ "${{ github.event_name }}" == "release" && "${{ github.event.release.tag_name }}" == *"-stg" ]]; then
            echo "environment=stg" >> $GITHUB_OUTPUT
            echo "aws_account_id=172065883315" >> $GITHUB_OUTPUT
            echo "aws_region=ap-south-1" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "release" && "${{ github.event.release.tag_name }}" == *"-prd" ]]; then
            echo "environment=prd" >> $GITHUB_OUTPUT
            echo "aws_account_id=525375333516" >> $GITHUB_OUTPUT
            echo "aws_region=ap-east-1" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
            echo "aws_account_id=172065883315" >> $GITHUB_OUTPUT
            echo "aws_region=ap-south-1" >> $GITHUB_OUTPUT
          fi

      - name: Docker meta
        if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        id: meta
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5
        with:
          images: |
            ${{ steps.env.outputs.aws_account_id }}.dkr.ecr.${{ steps.env.outputs.aws_region }}.amazonaws.com/platform-auth-api
          tags: |
            type=sha,event=branch,suffix=-dev,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Configure AWS credentials
        if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          aws-region: ${{ steps.env.outputs.aws_region }}
          role-to-assume: arn:aws:iam::${{ steps.env.outputs.aws_account_id }}:role/github-oidc-ecr-push-role
          role-duration-seconds: 3600
          role-session-name: GitHubActions

      - name: Login to Amazon ECR
        if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - name: Build
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          file: ./Dockerfile
          push: false
          tags: image:latest
          build-args: NUGET_PASSWORD=${{ secrets.NUGET_PASSWORD }}

      - name: Build & Push
        if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: NUGET_PASSWORD=${{ secrets.NUGET_PASSWORD }}

      - name: Logout to Amazon ECR
        if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: docker logout ${{ steps.login-ecr.outputs.registry }}
