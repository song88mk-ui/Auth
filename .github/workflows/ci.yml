name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  release:
    types:
      - released

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set environment
        id: env
        run: |
          if [[ "${{ github.event_name }}" == "release" && "${{ github.event.release.tag_name }}" == *"-stg" ]]; then
            echo "environment=stg" >> $GITHUB_OUTPUT
            echo "aws_account_id=172065883315" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
            echo "aws_account_id=418541840646" >> $GITHUB_OUTPUT
          fi

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f # v5
        with:
          images: |
            ${{ steps.env.outputs.aws_account_id }}.dkr.ecr.ap-south-1.amazonaws.com/platform-auth-api
          tags: |
            type=sha,event=pr,prefix=pr-sha-
            type=sha,event=branch,prefix={{branch}}-sha-,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ap-south-1
          role-to-assume: arn:aws:iam::${{ steps.env.outputs.aws_account_id }}:role/github-oidc-ecr-push-role
          role-duration-seconds: 3600
          role-session-name: GitHubActions

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Logout to Amazon ECR
        if: always()
        run: docker logout ${{ steps.login-ecr.outputs.registry }}
